<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Saytim</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #2563eb;
            padding: 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ddd;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(135deg, #2563eb, #9333ea);
            color: white;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        button {
            background: white;
            color: #2563eb;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #ddd;
        }

        .about {
            padding: 50px 20px;
            text-align: center;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* TELEFON UCHUN */
        @media (max-width: 600px) {

            header {
                padding: 16px;
            }

            header h2 {
                font-size: 22px;
            }

            nav {
                gap: 12px;
                padding: 14px 8px;
            }

            nav a {
                font-size: 14px;
                margin: 0;
            }

            .hero {
                padding: 75px 15px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 16px;
                line-height: 1.5;
            }

            button {
                width: 100%;
                max-width: 250px;
                padding: 14px;
            }

            .about {
                padding: 40px 15px;
            }

            .about h2 {
                font-size: 24px;
                margin-bottom: 12px;
            }

            .about p {
                font-size: 15px;
                line-height: 1.6;
            }

            footer {
                padding: 20px 10px;
                font-size: 14px;
                line-height: 1.8;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>MENING SAYTIM</h2>
    </header>

    <nav>
        <a href="#home">Bosh sahifa</a>
        <a href="#about">Biz haqimizda</a>
        <a href="#contact">Aloqa</a>
    </nav>

    <section class="hero" id="home">
        <h1>Xush kelibsiz!</h1>
        <p>Bu mening birinchi zamonaviy saytim.</p>
        <button onclick="salom()">Boshlash</button>
    </section>

    <section class="about" id="about">
        <h2>Biz haqimizda</h2>
        <p>Biz zamonaviy va chiroyli saytlar yaratamiz.</p>
    </section>

    <footer id="contact">
        <p>Aloqa: example@gmail.com</p>
        <p>© 2026 Barcha huquqlar himoyalangan</p>
    </footer>

    <script>
        function salom() {
            alert("Saytimizga xush kelibsiz!");
        }
    </script>

</body>
</html>
